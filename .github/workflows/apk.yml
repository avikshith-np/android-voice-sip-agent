name: APK

# Builds the pjsua2 native libraries and a signed release APK from source on every push, so the
# installed APK is traceable to a commit. Signing material comes from repository secrets; without
# them (e.g. pull requests from forks) the APK is built unsigned.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # The compile SDK platform is fetched by the Android Gradle plugin; the NDK is pinned by the native script.
          "$SDKM" --install "ndk;28.2.13676358" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Native build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends swig

      - name: Cache upstream source tarballs
        uses: actions/cache@v4
        with:
          path: sip-pjsua2/build/pjproject/*.tar.gz
          key: native-tarballs-${{ hashFiles('sip-pjsua2/native/build-pjsua2.sh') }}

      - name: Build pjsua2 (pjsip + OpenSSL + Opus)
        run: sip-pjsua2/native/build-pjsua2.sh

      - name: Unit tests
        run: ./gradlew :voice-api:test :sip:test :gateway:test :telephony:testDebugUnitTest :privileged:testDebugUnitTest :app:testDebugUnitTest

      - name: Release APK
        env:
          KEYSTORE_B64: ${{ secrets.VSA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VSA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VSA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VSA_KEY_PASSWORD }}
        run: |
          SIGNING=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGNING=(-Pvsa.signing.storeFile="$RUNNER_TEMP/release.jks" -Pvsa.signing.storePassword="$STORE_PASSWORD"
                     -Pvsa.signing.keyAlias="$KEY_ALIAS" -Pvsa.signing.keyPassword="$KEY_PASSWORD")
          fi
          ./gradlew :app:assembleRelease "${SIGNING[@]}"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Checksums
        working-directory: app/build/outputs/apk/release
        run: |
          for f in *.apk; do mv "$f" "voice-sip-agent-${GITHUB_SHA::7}-${f}"; done
          sha256sum *.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: voice-sip-agent-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 30
